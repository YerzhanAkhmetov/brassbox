version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  exclusions:
    rules:
      # в тестах пути — из t.TempDir(), права — специально «неправильные»
      - path: _test\.go
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
